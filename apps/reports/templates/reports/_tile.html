{% load ui %}{# A stat tile: include with label=, value=, icon=, url= (optional), note= (optional). #}
<a href="{{ url|default:'#' }}" class="card stat">
  <div class="stat-label"><span>{{ label }}</span><span class="stat-icon">{% icon icon "size-[18px]" %}</span></div>
  <p class="stat-value">{{ value }}</p>
  {% if note %}<p class="stat-note">{{ note }}</p>{% endif %}
</a>
