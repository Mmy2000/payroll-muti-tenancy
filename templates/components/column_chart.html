{% load i18n %}{# Columns over time (apps.core.charts.columns): include with chart= and label= (what it shows). #}
<figure class="viz" data-viz>
  <svg viewBox="0 0 {{ chart.width }} {{ chart.height }}" class="h-auto w-full" direction="ltr" style="direction: ltr" role="img" aria-label="{{ label }}">
    {% for tick in chart.ticks %}<line class="viz-rule" x1="{{ chart.left }}" x2="{{ chart.right }}" y1="{{ tick.y }}" y2="{{ tick.y }}"/>
    <text class="viz-text" x="{{ chart.left|add:'-6' }}" y="{{ tick.y }}" dy="3.5" text-anchor="end">{{ tick.text }}</text>{% endfor %}
    {% for mark in chart.marks %}
    <g data-mark data-title="{{ mark.title }}" data-value="{{ mark.shown }}">
      <rect class="viz-hit" x="{{ mark.hit_x }}" y="{{ chart.top }}" width="{{ mark.hit_w }}" height="{{ chart.plot_h }}"/>
      {% if mark.path %}<path class="viz-bar" d="{{ mark.path }}"/>{% endif %}
      {% if mark.show_value %}<text class="viz-text viz-value" x="{{ mark.label_x }}" y="{{ mark.value_y }}" text-anchor="middle">{{ mark.shown }}</text>{% endif %}
      {% if mark.axis_label %}<text class="viz-text" x="{% if mark.axis_anchor == 'end' %}{{ chart.width }}{% else %}{{ mark.axis_x }}{% endif %}" y="{{ chart.axis_y }}" text-anchor="{{ mark.axis_anchor }}">{{ mark.axis_label }}</text>{% endif %}
    </g>
    {% endfor %}
  </svg>
  <div class="viz-tip hidden" data-viz-tip role="status"></div>
  <details class="mt-2 text-xs text-slate-500">
    <summary class="cursor-pointer select-none">{% translate "As a table" %}</summary>
    <table class="table mt-2 text-sm"><tbody>{% for name, value in chart.rows %}<tr><td>{{ name }}</td><td class="text-end"><span class="num">{{ value }}</span></td></tr>{% endfor %}</tbody></table>
  </details>
</figure>
