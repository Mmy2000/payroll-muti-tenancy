{% load i18n ui %}{# The preview of a bulk change (static/core/js/bulk.js): include inside a form[data-bulk-form]. #}
<div class="hidden rounded-lg border border-red-200 bg-red-50/70 px-3.5 py-3 text-sm text-red-700" data-form-error role="alert"></div>
<div class="flex flex-wrap gap-3">
  <button type="submit" class="btn btn-secondary">{% icon "eye" "size-4" %}{% translate "Preview" %}</button>
</div>
<section class="card overflow-hidden transition-opacity" data-bulk-result hidden>
  <div class="flex flex-wrap items-center justify-between gap-3 border-b border-slate-100 px-4 py-3">
    <p class="text-sm text-slate-700" data-bulk-summary></p>
    <div class="flex flex-wrap gap-2">
      <button type="button" class="btn btn-primary" data-bulk-save hidden></button>
      <button type="button" class="btn btn-primary" data-bulk-save-passing hidden></button>
    </div>
  </div>
  <div class="overflow-x-auto">
    <table class="table">
      <thead><tr><th>{% translate "Employee" %}</th><th>{{ detail_label }}</th><th>{% translate "Check" %}</th><th>{% translate "Notes" %}</th></tr></thead>
      <tbody data-bulk-rows></tbody>
    </table>
  </div>
  <template data-bulk-row><tr><td class="font-medium text-slate-900" data-slot="name"></td><td class="num" data-slot="detail"></td><td data-slot="status"></td><td data-slot="notes"></td></tr></template>
</section>
